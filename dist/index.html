</style><div class="bar"><header><img src="logo.png" alt="Grupo Bom Jesus"><small>Engenharia e Telecomunicações</small></header></div><section class="hero"><div class="wrap"><small>Grupo Bom Jesus</small><h1>Central de contratos</h1><p>Selecione o modelo, preencha os dados e exporte o contrato em PDF.</p></div></section><div class="wrap"><main><nav class="steps" aria-label="Etapas"></nav><section id="home"><h2>Escolha o contrato</h2><div class="cards"></div></section><section id="edit" hidden><h2 id="heading"></h2><form id="form"></form></section><section id="review" hidden><h2>Conferir documento</h2><div class="actions"><button class="btn minor" id="back">Voltar ao preenchimento</button><button class="btn" id="export">Exportar PDF</button></div><p class="note">Na janela de impressão, selecione “Salvar como PDF” e desative os cabeçalhos e rodapés do navegador.</p><article class="preview"></article></section></main></div><article id="print"></article><script>const bodies=["As partes acima elencadas, CONTRATANTE E CONTRATADO, firmam entre si o presente Contrato de Empreitada, conforme cláusulas a seguir.\n\nCLÁUSULA 1 – OBJETO DO CONTRATO\n\n1.1 O presente contrato tem como objeto a execução de {{objeto}}, que serão realizados pela CONTRATADA para a CONTRATANTE, no local indicado pelo cliente da CONTRANTE, indicado em {{local}}. Os serviços a serem executados são descritos conforme o projeto fornecido pela CONTRATANTE, respeitando as especificações técnicas e legais vigentes.\n\n\n1.1.1 {{escopo}}.\n\n1.2 A CONTRATADA será responsável pelo fornecimento da mão de obra qualificada, equipamentos, ferramentas e Equipamentos de Proteção Individual (EPIs) necessários para a execução dos serviços e documentações de NRs específicas para execução dos serviços. Além disso, a alimentação, hospedagem, e locomoção da equipe também serão de responsabilidade da Contratada. {{materiais}}\n\nCLÁUSULA 2 – PRAZOS DE EXECUÇÃO\n\n2.1 A obra terá início em {{inicio}} a {{fim}}, podendo ser prorrogado mediante andamento da execução da obra, por meio de aditivo.\n\n2.2 Findo o prazo estipulado, o contrato será automaticamente rescindido, sem necessidade de aviso prévio da outra parte.\n\n2.3 Não serão contabilizadas no prazo fixado nesta cláusula eventuais interrupções na execução das atividades da empreitada, desde que decorrente de justa causa.\n\nCLÁUSULA 3 – PREÇO E CONDIÇÕES DE PAGAMENTO\n\n3.1 O preço total ajustado para a execução dos serviços objeto deste contrato é de {{valor}} ({{extenso}}), a ser pago em parcelas, de acordo com o percentual de avanço físico da obra, mediante apresentação de medição pela CONTRATADA e aprovação expressa da CONTRATANTE, conforme segue:\n\n{{parcelas}}\n\n3.2 As medições deverão ser acompanhadas de relatório descritivo, registros fotográficos e demais documentos técnicos que comprovem a execução dos serviços. A liberação de cada parcela está condicionada à aprovação da medição pela CONTRATANTE, que poderá designar profissional habilitado para validação.\n\n3.3 Em caso de inadimplência da CONTRATANTE quanto a parcelas efetivamente devidas, incidirá multa de 2% (dois por cento) sobre o valor inadimplido, além de juros de mora de 1% (um por cento) ao mês e correção monetária pelo IPCA/IBGE.\n\n3.4 A CONTRATADA deverá emitir a respectiva nota fiscal após a aprovação da medição, enviando-a para o e-mail: financeiro@engenhariabomjesus.com.br. O pagamento será efetuado por meio de depósito bancário na conta da CONTRATADA: {{banco}}, servindo o comprovante como recibo.\n\n3.5 O valor definido na Cláusula\n\n3.1 acima, engloba todos os custos diretos e indiretos despendidos ou a serem despendidos pela CONTRATADA para a prestação dos serviços, {{precoMateriais}}. Assim, todos os tributos, taxas, emolumentos e contribuições fiscais que incidam ou venham a incidir sobre a prestação dos serviços objeto deste Contrato serão de inteira e exclusiva responsabilidade da CONTRATADA, que deverá realizar os respectivos recolhimentos sem direito a qualquer reembolso.\n\n3.6 Qualquer alteração no valor total do contrato deverá ser formalizada por meio de Termo Aditivo, devidamente justificado e assinado por ambas as partes, especialmente em caso de alterações no escopo ou extensão dos serviços.\n\nCLÁUSULA 4 – DA APRESENTAÇÃO DE DOCUMENTOS E REGULARIDADE JURÍDICA E RESPONSABILIDADE TRABALHISTA\n\n4.1 Fica estabelecido e convencionado entre as partes que a CONTRATADA deverá apresentar à CONTRATANTE, no momento da formalização do contrato e sempre que solicitado, os seguintes documentos válidos e atualizados:\n\n(i) Licença ou alvará pertinente ao exercício de sua atividade, em conformidade com seu objeto social; (ii) Certidão Negativa de Débitos Federais (CQTF-RF), emitida pela Secretaria da Receita Federal; (iii) Certificado de Regularidade de Situação do FGTS (CRF-FGTS), emitido pela Caixa Econômica Federal; (iv) Contrato Social e/ou a última alteração contratual registrada.\n\n4.2 O não fornecimento dos documentos listados no item\n\n4.1 poderá ensejar a suspensão dos pagamentos ou até mesmo a rescisão do contrato por parte da CONTRATANTE, sem prejuízo das sanções previstas neste instrumento e na legislação aplicável.\n\n4.3 Fica expressamente estipulado que este contrato não gera qualquer vínculo empregatício entre a CONTRATANTE e a CONTRATADA, nem tampouco com qualquer trabalhador, empregado ou prestador de serviços contratado, direta ou indiretamente, pela Contratada para a execução dos serviços aqui ajustados. A Contratada será a única e exclusiva responsável pela supervisão, remuneração e cumprimento de todas as obrigações legais relacionadas ao seu pessoal, abrangendo, entre outros, os encargos trabalhistas, previdenciários, securitários, fiscais ou de qualquer outra natureza.\n\n4.4 A CONTRATADA compromete-se a cumprir integralmente todas as obrigações trabalhistas, previdenciárias, securitárias e fundiárias relativas aos seus funcionários, colaboradores ou prestadores de serviço, incluindo, mas não se limitando ao pagamento de salários, benefícios, 13º salário, férias, FGTS, contribuições previdenciárias e quaisquer encargos decorrentes da legislação aplicável, isentando a CONTRATANTE de qualquer responsabilidade sobre tais obrigações, inclusive em casos de acidente de trabalho.\n\n4.5 Todos os profissionais contratados pela Contratada para trabalhos em altura deverão possuir a devida certificação, conforme a Norma Regulamentadora NR-35, responsabilizando- se a Contratada pelo treinamento e segurança desses profissionais.\n\n4.6 Correm por conta da CONTRATADA os riscos da obra, até o momento de sua entrega a CONTRATANTE.\n\n4.6.1 Correm, porém, por conta da CONTRATANTE os riscos da obra, quando este estiver em mora.\n\n4.6.2 Responderão solidariamente a CONTRATANTE e a CONTRATADA por danos causados às edificações vizinhas à obra.\n\n4.6.3 Responderá a CONTRATADA por danos causados a terceiros não-vizinhos.\n\n4.6.4 A CONTRATADA responderá pela solidez e pela segurança da obra, pelo prazo de 05 (cinco) anos, contados da data de entrega desta a CONTRATANTE;\n\n4.6.5 A responsabilidade prevista no tópico anterior permanece, ainda que seja alienado o bem correspondente à obra.\n\nCLAÚSULA 5 - DA ENTREGA DA OBRA\n\n5.1 No momento de entrega da obra, A CONTRATANTE realizará vistoria técnica, para verificar as condições e as características desta.\n\n5.2 A CONTRATANTE poderá se recusar a receber a obra, caso:\n\n5.2.1 A CONTRATADA tenha se afastado dos planos ou das instruções recebidas;\n\n5.2.2 Na ausência de planos ou instruções específicas, não tenha A CONTRATADA seguido as regras de arte ou do costume do local;\n\n5.2.3 A obra apresente defeitos, ou seja, inapta ao uso regular para o qual se destina;\n\n5.2.4 A obra não tenha sido entregue no prazo fixado neste contrato;\n\n5.3 No caso do parágrafo anterior, poderá ainda a CONTRATANTE optar por receber a obra, com abatimento do preço, bem como em caso de descumprimento do prazo de entrega da obra estipulado neste contrato, incidirá sobre o valor total pactuado uma multa de 10% (dez por cento), a ser paga pela CONTRATADA à CONTRATANTE, sem prejuízo das demais sanções previstas em lei e neste instrumento.\n\n5.4 Após devidamente recebida a obra como boa e perfeita, não poderá a CONTRATANTE reclamar defeitos, exceto quando se tratar de vício redibitório.\n\nCLÁUSULA 6 – OBRIGAÇÕES DA CONTRATADA\n\n6.1 Executar os serviços descritos na cláusula 1 conforme as especificações e normas técnicas aplicáveis, além de seguir o projeto de obra e as exigências da CONTRATANTE.\n\n6.2 Obedecer a todas as normas de segurança do trabalho, inclusive utilizando e fornecendo os equipamentos de proteção individual e coletiva necessários aos seus empregados.\n\n6.3 Responsabilizar-se por todos os danos causados ao imóvel e obra do CONTRATANTE ou a terceiros em decorrência da execução dos serviços.\n\n6.4 Manter a obra limpa e organizada, removendo entulhos e resíduos regularmente.\n\n6.5 Entregar, da forma e no prazo ajustado, a obra descrita neste contrato.\n\n6.6 Fornecer toda a mão-de-obra necessária à execução e conclusão da obra, da forma e no prazo ajustados.\n\n6.7 Responsabilizar-se pelos atos e omissões praticados por seus subordinados, bem como por quaisquer danos que os mesmos venham a sofrer ou causar para o CONTRATANTE ou terceiros.\n\n6.8 Arcar devidamente, nos termos da legislação trabalhista, com a remuneração e demais verbas laborais devidas a seus subordinados, inclusive encargos fiscais e previdenciários referentes às relações de trabalho.\n\n6.9 Arcar com todas as despesas de natureza tributária decorrentes dos serviços especificados neste contrato.\n\n6.10 Cumprir todas as determinações impostas pelas autoridades públicas competentes, referentes a estes serviços.\n\n6.11 Reparar os defeitos e as desconformidades eventualmente apresentadas pela obra em relação ao projeto, às normas e às instruções recebidas.\n\n6.12 Manter sigilosas, mesmo após findo este contrato, as informações privilegiadas de qualquer natureza às quais tenha acesso em virtude da execução desta obra.\n\nCLÁUSULA 7 – OBRIGAÇÕES DO CONTRATANTE\n\n7.1 Fornecer à CONTRATADA todas as informações e documentos necessários para a execução dos serviços.\n\n7.2 Facilitar o acesso da CONTRATADA ao local da obra.\n\n7.3 Realizar os pagamentos conforme condições estabelecidas na Cláusula 3.\n\n7.4 Comunicar imediatamente a CONTRATADA sobre eventuais reclamações feitas contra seus subordinados, assim como sobre danos por ele causados.\n\nCLÁUSULA 8 – GARANTIAS E PENALIDADES\n\n8.1 A CONTRATADA garante os serviços realizados por um período de 6 (seis) meses após a conclusão da obra, comprometendo-se a reparar quaisquer defeitos verificados nesse período, sem custos adicionais para o CONTRATANTE.\n\n8.2 Em caso de descumprimento de qualquer cláusula deste contrato, a parte inadimplente pagará à parte prejudicada uma multa de 10% (dez por cento) do valor total do contrato, sem prejuízo de eventuais perdas e danos.\n\nCLÁUSULA 9 - DA RESCISÃO\n\n9.1 Não obstante o disposto na Cláusula 2, fica ressalvado às Partes o direito de resilir o presente Contrato, a qualquer tempo e de forma imotivada, sem que seja devida qualquer indenização e/ou multa, desde que denunciado por escrito, mediante notificação prévia de 30 (trinta) dias, sendo certo que durante o aviso prévio os serviços aqui contratados, bem como o pagamento do(s) valor(es) devido(s) deverão ser cumpridos regularmente, nos termos deste Contrato, exceto se negociado de forma diversa entre as Partes.\n\n9.2 Este Contrato poderá ainda ser rescindido por qualquer das Partes, por justa causa e independentemente de quaisquer notificações judiciais ou extrajudiciais, na ocorrência dos seguintes eventos:\n\n9.2.1 Se uma das Partes deixar de cumprir quaisquer das obrigações estipuladas no presente contrato, inclusive seus aditamentos, e não as sanar em até 10 (dias) dias contados do recebimento de notificação escrita da outra Parte neste sentido; e/ou\n\n9.2.2 Dissolução, recuperação judicial ou extrajudicial, liquidação, falência ou insolvência de qualquer das Partes, ou quando a CONTRATADA cessar suas operações normais, comprometendo o andamento regular dos serviços contemplados neste Contrato; e/ou\n\n9.2.3 Na ocorrência de caso fortuito ou de força maior, que suspenda a execução do presente contrato por mais de 15 (quinze) dias, nos termos do art. 393, do Código Civil.\n\n9.2.4 falta da documentação e licenças necessárias para a prestação de serviços objeto do presente Contrato;\n\n9.2.5 do conhecimento de fatos ou circunstâncias que desabonem a idoneidade comercial da CONTRATANTE ou comprometam a sua capacidade econômica, financeira ou técnica;\n\n\n\n9.3 Se a rescisão for de iniciativa da CONTRATADA, caberá a ela prestar conta de todos os serviços que até então tenham sido prestados/executados, recebendo, em seguida, a\n\nimportância a que eventualmente fizer jus, perecendo o direito a qualquer pagamento pelos serviços que não tenham sido concluídos.\n\n\n9.4 Sendo da CONTRATANTE a iniciativa de resilir o Contrato, sem justo motivo, serão devidos somente os valores em relação aos serviços já concluídos e/ou performados e que estejam, ainda, pendentes de pagamento.\n\n9.5 Nenhuma das hipóteses de rescisão previstas na cláusula 6.3, acima, prejudicará ou limitará de qualquer forma o direito da respectiva Parte de pleitear indenização por quaisquer perdas e danos comprovadamente incorridos em decorrência da infração ou inadimplemento contratual cometido por quaisquer das outras Partes.\n\nCLÁUSULA 10 – DA AUTONOMIA DAS PARTES\n\n\n\n10.1 O presente Contrato não estabelece qualquer vínculo de natureza societária ou de associação entre as Partes, que permanecem pessoas jurídicas independentes e autônomas.\n\n\n10.2 Nenhuma disposição prevista neste Contrato poderá ser interpretada no sentido de estabelecimento de qualquer vínculo empregatício entre a CONTRATANTE e a CONTRATADA e os sócios e/ou empregados desta última. Nesse sentido, os serviços objeto deste Contrato serão prestados pela CONTRATADA sem exclusividade, não constituindo, portanto, sob qualquer análise, pressuposto para configuração de vínculo empregatício entre as Partes contratantes. Dessa maneira, inexistem obrigações relativas a contribuições trabalhistas e previdenciárias, assim como indenizações, ressarcimentos e/ou compensações contratuais por parte da CONTRATANTE.\n\n\n10.3 Todos e quaisquer encargos de natureza trabalhista, previdenciária e/ou securitária devidos aos colaboradores da CONTRATADA, para execução dos serviços ora contratados, serão de exclusiva responsabilidade da CONTRATADA, não respondendo a CONTRATANTE por tais encargos, sequer de modo subsidiário.\n\n\n10.4 A CONTRATADA, desde já, isenta a CONTRATANTE de qualquer responsabilidade que venha a ser imputada a esta em decorrência de ações, reclamações ou reivindicações de natureza trabalhista, previdenciária ou securitária, propostas pelos empregados, prepostos e contratados ou terceirizados da CONTRATADA. Dessa maneira, a CONTRATADA se\n\ncompromete, ainda, a ressarcir e/ou indenizar a CONTRATANTE por todo e qualquer valor, custo e/ou despesa que esta venha a incorrer em virtude de tais ações, reclamações ou reivindicações, especialmente, mas não exclusivamente, custas judiciais, despesas processuais e honorários advocatícios.\n\n\n\nCLÁUSULA 11- DA REALIZAÇÃO DE AUDITORIAS OU INSPEÇÕES\n\n11.1. A CONTRATANTE realizará auditorias periódicas, para apuração de eventuais irregularidades ou erros da CONTRATADA, sem a necessidade de notificação prévia.\n\n11.1.1 A CONTRATADA deve cooperar com o CONTRATANTE na medida em que for necessário para possibilitar a auditoria. Sendo requisitada, a CONTRATADA deve fornecer à CONTRATANTE cópias dos materiais.\n\n11.1.2 A CONTRATANTE poderá designar profissional técnico, devidamente habilitado, para fiscalizar a execução dos serviços, inclusive com emissão de relatórios, medições e pareceres sobre a conformidade técnica da obra. A CONTRATADA deverá fornecer livre acesso ao local e colaborar com todas as verificações necessárias.\n\n\n\nCLÁUSULA 12- DO SIGILO E DA CONFIDENCIALIDADE\n\n12.1 A CONTRATADA reconhece que as informações a que tiver acesso em virtude do presente Contrato são confidenciais e constituem segredos comerciais valiosos (“Informações Confidenciais”), declarando que todos os fatos, documentos, dados e outras informações relativas à CONTRATANTE e/ou terceiros que vier a tomar conhecimento, seja verbalmente, pelos sistemas ou por escrito, o serão em caráter confidencial, razão pela qual se obriga neste ato, a manter sob o mais absoluto sigilo e confidencialidade, todas e quaisquer informações e dados da CONTRATANTE dos quais venha a tomar conhecimento por força deste Contrato.\n\n12.2 As Informações Confidenciais significam, para os fins desta Cláusula, sem se limitar, toda e qualquer informação e/ou dados, patenteados ou não, de natureza técnica, operacional, comercial, jurídica, know-how, invenções, processos, fórmulas e designs, patenteáveis ou não, planos de negócios (business plans), métodos de contabilidade, técnicas e experiências acumuladas, documentos, contratos, papéis, estudos, pareceres e pesquisas, informações mercadológicas e quaisquer outras, transmitidas pela CONTRATANTE à CONTRATADA por meio físico (e.g., documentos impressos, manuscritos, fac-símile, mensagens eletrônicas (e- mail), fotografias etc.), por qualquer forma registrada em mídia eletrônica, tais como, mas sem\n\nlimitação, fitas, laser-discs, pen drive, pelo acesso aos sistemas, ou qualquer outro meio magnético, ou oralmente, assim como resumos, anotações e quaisquer comentários, orais ou escritos, ou aquelas cujo conteúdo da informação torne óbvia a natureza confidencial.\n\n12.3 Para resguardar o sigilo e confidencialidade das Informações Confidenciais, a CONTRATADA deverá envidar todos os esforços possíveis e empregar os mesmos meios que utilizam para proteção de suas próprias Informações Confidenciais.\n\n12.4 A CONTRATADA concorda que todas as informações confidenciais serão utilizadas somente no cumprimento deste Contrato, salvo se autorizada a divulgação pela CONTRATANTE, sempre previamente e por escrito, ou quando a divulgação for exigida por lei ou ordem judicial.\n\n12.5 No ato do término ou rescisão deste Contrato, por qualquer motivo, a CONTRATADA deverá imediatamente devolver ou inutilizar quaisquer informações confidenciais que estejam em forma escrita ou outro meio tangível, sem reter quaisquer cópias, exceto se a sua manutenção se destine ao cumprimento de obrigações previstas na legislação em vigor.\n\n12.6 As obrigações assumidas nos termos desta Cláusula permanecerão válidas e exigíveis durante a vigência do presente Contrato, bem como pelo prazo de 03 (três) anos contados do encerramento deste Contrato, por qualquer razão.\n\n12.7 A infração desta cláusula pela CONTRATADA dará ensejo à CONTRATANTE de resolver o presente Contrato de pleno direito, ocasião em que serão apuradas as perdas e danos cabíveis.\n\nCLÁUSULA 13 - DISPOSIÇÕES GERAIS\n\n13.1 O presente contrato não gera direito de exclusividade entre as partes, desde que não haja incompatibilidade de horários ou de interesses, a CONTRATADA poderá desempenhar suas atividades para terceiros em geral.\n\n13.2 Nenhuma das Partes poderá ceder ou transferir qualquer direito ou obrigação deste Contrato, sem o prévio e expresso consentimento, por escrito, da outra Parte, sob pena de responder pelas perdas e danos a que der causa, independentemente da possibilidade de rescisão contratual, nos termos previstos no presente Contrato.\n\n13.3 Quaisquer serviços que não estejam expressamente previstos no projeto e neste contrato somente poderão ser executados mediante autorização por escrito da CONTRATANTE, com a\n\ncelebração de termo aditivo específico, que deverá indicar o objeto, o valor e o prazo de execução do serviço adicional.\n\n13.4 Caso qualquer disposição deste Contrato seja declarada nula ou ineficaz, esta declaração não implicará na invalidade ou ineficácia das demais disposições ajustadas, que permanecerão integralmente válidas e eficazes. As Partes contratantes, entretanto, deverão substituir, na medida do possível, a cláusula declarada nula ou ineficaz por outra válida e eficaz que mais se aproxime da sua intenção originalmente acordada.\n\n13.5 As Partes reconhecem, desde já, que a relação estabelecida por meio deste Contrato não irá configurar de forma alguma, sociedade, joint venture, cisão, fusão ou qualquer outra relação jurídica, tampouco irá representar quaisquer outros direitos às partes, além dos supramencionados, devendo ser interpretado sob o ponto de vista restritivo, de modo a não permitir qualquer interpretação diferente da objetivada pelas Partes.\n\n13.6 A eventual tolerância, por qualquer das Partes, da inexecução de qualquer cláusula ou condição do presente Contrato, seja a que tempo for, deverá ser interpretada como mera liberalidade, não implicando, portanto, em novação, transação, perdão, renúncia ou dispensa da obrigação assumida, nem desistência do cumprimento das disposições aqui contidas, ainda que o dispositivo violado possa ser considerado como cancelado ou modificado unilateralmente.\n\n13.7 O presente Contrato foi redigido dentro dos princípios de boa-fé e probidade, sem vício de consentimento. As Partes declaram para todos os efeitos legais que: (i) as obrigações aqui assumidas estão dentro de suas condições econômico-financeiras; (ii) este Contrato espelha fielmente a tudo o que foi ajustado; e (iii) tiveram conhecimento prévio do conteúdo deste Contrato e entenderam perfeitamente todas as obrigações nela contidas.\n\n13.8 Nenhuma Parte será responsabilizada pelo não cumprimento de qualquer cláusula deste Contrato se o inadimplemento for decorrente de caso fortuito e força maior.\n\n13.9 Os serviços a serem desenvolvidos pela CONTRATADA nos termos deste instrumento não a autoriza, sob qualquer circunstância, a fazer uso do nome da CONTRATANTE em qualquer material de divulgação, promoção ou propaganda, sem prévio consentimento, por escrito, dos representantes legais da CONTRATANTE.\n\n13.10 A celebração do presente Contrato não importa em outorga pela CONTRATANTE à CONTRATADA de mandato ou autorização para celebração de qualquer ato ou negócio jurídico, assim como para emissão de quaisquer declarações ou prestação de quaisquer informações em nome e por conta da CONTRATANTE, seus sócios, empregados e/ou administradores.\n\n13.11 O presente Contrato substitui quaisquer entendimentos anteriores por ventura existentes e/ou relacionados aos serviços ora contratados, representando o completo e integral entendimento entre as Partes com relação ao objeto neles previsto.\n\n13.12 As Partes declaram neste ato que seus representantes possuem plenos poderes para celebrar o presente Contrato, nos termos do respectivo Contrato ou Estatuto Social.\n\n13.13 As partes elegem o foro da comarca de Cerquilho/SP para dirimir quaisquer dúvidas ou controvérsias oriundas deste contrato, com renúncia expressa a qualquer outro, por mais privilegiado que seja.\n\nE por estarem justas e contratadas, as partes assinam este contrato em duas vias de igual teor e forma, juntamente com duas testemunhas.","A parte acima identificada, doravante denominada individualmente \"Parte\" e em conjunto \"Partes\", resolvem celebrar o presente Contrato de Prestação de Serviços de Telecomunicações, que se regerá pelas seguintes cláusulas e condições:\n\n\n\nCLÁUSULA 1 – OBJETO DO CONTRATO\n\n1.1 Objeto Geral O presente contrato tem por objeto a prestação de serviços especializados no setor de telecomunicações pela CONTRATADA à CONTRATANTE, compreendendo, de forma ampla e integrada, as seguintes atividades:\n\n\n(I) Implantação de equipamentos de Telecom (Módulos, antenas, cabeamentos e acessórios de RF); (II) Desmobilização, desmontagem e remoção de infraestrutura de telecomunicações (torres, antenas, cabos, equipamentos ativos e passivos, racks e demais estruturas correlatas);\n\n(III) Desativação de sistemas de telecomunicações, incluindo desinstalação elétrica e lógica de equipamentos de rádio, transmissão e dados; (IV) Serviços civis correlatos à infraestrutura de telecom, tais como adequações estruturais em sites, rooftops, torres e abrigos técnicos (shelters), demolições parciais de bases e fundações de torres, e readequações de espaços físicos para fins de telecomunicação; (V) Remoção, acondicionamento e transporte de equipamentos, cabos e materiais desmobilizados, conforme legislação de resíduos vigente; (VI) Demais serviços necessários à execução completa do escopo solicitado, conforme demanda da CONTRATANTE.\n\n\n1.2 Ordens de Serviço Os serviços serão executados nos locais indicados pela CONTRATANTE ou por seus clientes (operadoras, concessionárias ou detentoras de infraestrutura de telecomunicações), observadas as especificações técnicas, normas da ANATEL e demais normas legais e regulatórias aplicáveis.\n\n\nA descrição detalhada do escopo, quantitativos, metodologia de execução, localização dos sites e demais condições técnicas e operacionais de cada demanda será formalizada exclusivamente por meio de Ordens de Serviço (OS) específicas, emitidas pela CONTRATANTE e enviadas através do Whatsapp e/ou e-mail, que passam a integrar o presente contrato para todos os fins de direito.\n\n\n1.3 Responsabilidades da CONTRATADA A CONTRATADA será responsável exclusivamente pelo fornecimento de: (I) Mão de obra qualificada e habilitada, incluindo profissionais com certificações NR-10 (instalações elétricas), NR-35 (trabalho em altura), NR-33 (espaços confinados), e demais NRs aplicáveis aos serviços de telecom; (II) Equipamentos, ferramentas e instrumentos técnicos necessários à execução dos serviços;\n\n(III) Equipamentos de Proteção Individual (EPIs) e Equipamentos de Proteção Coletiva (EPCs); (IV) Veículos e logística de transporte da equipe e dos equipamentos desmobilizados; (V) Alimentação, hospedagem e locomoção da equipe técnica nos locais de execução; (VI) Toda documentação técnica, licenças e certificações exigidas pelas normas aplicáveis ao setor de telecomunicações.\n\n\n1.4 Responsabilidades da CONTRATANTE Compete exclusivamente à CONTRATANTE o fornecimento de materiais específicos indicados nas Ordens de Serviço, quando expressamente acordado, e o acesso aos sites de telecomunicações para execução dos serviços.\n\n\n\nCLÁUSULA 2 – PRAZOS DE EXECUÇÃO\n\n2.1 O presente contrato terá prazo de {{vigencia}}, contados a partir da data de sua assinatura, podendo ser prorrogado mediante Termo Aditivo assinado por ambas as partes com antecedência mínima de 30 (trinta) dias do término vigente.\n\n2.2 Findo o prazo estipulado, o contrato será automaticamente rescindido, sem necessidade de aviso prévio da outra parte.\n\n2.3 O prazo de execução de cada Ordem de Serviço será definido individualmente na respectiva OS. O descumprimento do prazo estabelecido na OS sujeitará a CONTRATADA às penalidades previstas na Cláusula 8.\n\n2.4 Não serão contabilizadas no prazo fixado eventuais interrupções na execução das atividades, desde que decorrentes de justa causa devidamente comprovada por escrito e previamente comunicada à CONTRATANTE.\n\n2.5 A CONTRATADA deverá comunicar à CONTRATANTE, com antecedência mínima de 24 (vinte e quatro) horas, qualquer circunstância que possa comprometer o cumprimento dos prazos estabelecidos, para que a CONTRATANTE possa adotar as medidas cabíveis junto ao seu cliente.\n\nCLÁUSULA 3 – PREÇO E CONDIÇÕES DE PAGAMENTO\n\n3.1 Os valores referentes à execução dos serviços serão definidos e formalizados por meio de Ordem de Serviço (OS) emitida pela CONTRATANTE, contendo a descrição do escopo, condições aplicáveis e respectivos valores. Cada OS poderá possuir valores diferenciados, de acordo com a complexidade, extensão, localização geográfica e necessidades específicas dos serviços.\n\n3.2 As medições para liberação de pagamento deverão ser acompanhadas obrigatoriamente de: (I) Relatório descritivo dos serviços executados; (II) Registros fotográficos georreferenciados (com data, hora e localização) do antes e depois de cada serviço; (III) Termos de aceite de campo assinados pelo responsável técnico no site; (IV) Certificados de destinação dos equipamentos e materiais desmobilizados (quando aplicável); (V) Comprovante de regularidade fiscal e trabalhista (FGTS e INSS) do período de execução.\n\n3.3 A liberação de cada parcela está condicionada à aprovação formal da medição pela CONTRATANTE, que terá prazo de até 5 (cinco) dias úteis para aprovar ou solicitar correções após o recebimento de toda a documentação referida no item 3.2. A ausência de manifestação dentro do prazo implicará aprovação tácita da medição.\n\n3.4 Em caso de inadimplência da CONTRATANTE quanto a parcelas efetivamente aprovadas e devidas, incidirá multa de 2% (dois por cento) sobre o valor inadimplido, além de juros de mora de 1% (um por cento) ao mês, pro rata die, e correção monetária pelo IPCA/IBGE.\n\n3.5 A CONTRATADA deverá emitir a respectiva nota fiscal após a aprovação da medição, enviando-a para o e-mail: gestao.engenharia@construtorabomjesus.com.br. O pagamento será efetuado por meio de depósito bancário na conta da CONTRATADA, em até 15 (quinze) dias úteis após o recebimento da nota fiscal.\n\n3.6 O valor definido na OS engloba todos os custos diretos e indiretos da CONTRATADA para a prestação dos serviços, incluindo tributos, taxas, emolumentos e contribuições fiscais incidentes. Todos os recolhimentos são de inteira e exclusiva responsabilidade da CONTRATADA, sem direito a qualquer reembolso pela CONTRATANTE.\n\n3.7 Qualquer alteração no valor de OS já emitida ou no valor total do contrato deverá ser formalizada por meio de Termo Aditivo, devidamente justificado e assinado por ambas as partes.\n\n3.8 Retenções Legais – A CONTRATANTE fica autorizada a reter, nos pagamentos devidos à CONTRATADA, os valores correspondentes a tributos e contribuições previstas em lei (ISS, INSS, IRRF e demais contribuições), deduzindo-os da nota fiscal emitida, conforme legislação vigente.\n\n3.9 A parte contratada declara e aceita, para todos os fins de direito, que integra a equipe de trabalho do empreiteiro {{gestor}}, sendo este o único e exclusivo responsável pelo gerenciamento técnico e financeiro das atividades contratadas, incluindo, mas não se limitando a: análise e aceite de valor e escopo das OSs, planejamento operacional, administração de recursos, execução dos serviços e realização de todos os pagamentos devidos aos membros de sua equipe, fornecedores e terceiros envolvidos.\n\n\n\nCLÁUSULA 4 – DOCUMENTAÇÃO, REGULARIDADE JURÍDICA E RESPONSABILIDADE TRABALHISTA\n\n4.1 A CONTRATADA deverá apresentar à CONTRATANTE, no momento da assinatura deste contrato, mensalmente durante sua vigência e sempre que solicitado, os seguintes documentos válidos e atualizados: (I) Licença ou alvará pertinente ao exercício de suas atividades, em conformidade com seu objeto social; (II) Certidão Negativa de Débitos Federais (CND-RF/PGFN), emitida pela Receita Federal do Brasil; (III) Certificado de Regularidade de Situação do FGTS (CRF), emitido pela Caixa Econômica Federal; (IV) Certidão Negativa de Débitos Trabalhistas (CNDT), emitida pelo TST;\n\n(V) Contrato Social e/ou última alteração contratual registrada; VI) Registro ou habilitação junto a órgão regulador aplicável ao setor de telecomunicações, quando exigível; (VII) Comprovante de apólice de seguro de responsabilidade civil vigente, cobrindo danos materiais e corporais a terceiros decorrentes das atividades objeto deste contrato; (VIII) Relação nominal dos profissionais que atuarão nos serviços, com os respectivos certificados de treinamento em NR-10, NR-35 e demais NRs aplicáveis.\n\n4.2 O não fornecimento ou a irregularidade de qualquer dos documentos listados no item\n\n4.1 conferirá à CONTRATANTE o direito de: (i) suspender os pagamentos pendentes até a regularização; (ii) reter valores suficientes para cobertura de eventuais passivos; e (iii) rescindir o contrato por justa causa, sem prejuízo das sanções previstas na Cláusula 8.\n\n4.3 Fica expressamente estipulado que este contrato não gera qualquer vínculo empregatício entre a CONTRATANTE e a CONTRATADA, nem tampouco com qualquer trabalhador contratado, direta ou indiretamente, pela CONTRATADA. A CONTRATADA é a única e exclusiva responsável pela supervisão, remuneração e cumprimento de todas as obrigações legais relacionadas ao seu pessoal.\n\n4.4 A CONTRATADA compromete-se a cumprir integralmente todas as obrigações trabalhistas, previdenciárias, securitárias e fundiárias relativas a seus funcionários, incluindo salários, benefícios, 13º salário, férias, FGTS, contribuições previdenciárias e quaisquer encargos decorrentes da legislação aplicável, isentando e indenizando a CONTRATANTE de qualquer responsabilidade.\n\n4.5 Todos os profissionais da CONTRATADA que executarem trabalhos em altura deverão possuir certificação válida conforme NR-35, responsabilizando-se a CONTRATADA pelo treinamento, atualização e segurança desses profissionais.\n\n4.6 A CONTRATADA deverá manter seguro de acidentes de trabalho para todos os empregados e prestadores de serviço envolvidos na execução do objeto deste contrato, apresentando comprovante à CONTRATANTE quando solicitado.\n\n4.7 Em caso de acidente de trabalho, a CONTRATADA deverá comunicar a CONTRATANTE imediatamente, bem como adotar todas as providências legais cabíveis, isentando a CONTRATANTE de qualquer responsabilidade perante o trabalhador acidentado ou seus sucessores.\n\n\n\nCLÁUSULA 5 – CONCLUSÃO, ENTREGA E ACEITE DOS SERVIÇOS\n\n5.1 Ao término de cada Ordem de Serviço, a CONTRATADA comunicará formalmente a conclusão dos serviços à CONTRATANTE, que realizará vistoria técnica no prazo de até 5 (cinco) dias úteis para verificar a conformidade com o escopo contratado.\n\n5.2 A CONTRATANTE poderá recusar o aceite dos serviços, total ou parcialmente, caso: (I) A CONTRATADA tenha se afastado das especificações técnicas ou das instruções constantes na OS; (II) Os serviços não atendam às normas técnicas do setor de telecomunicações e às regulamentações da ANATEL; (III) Os serviços apresentem defeitos, vícios ou estejam inaptos ao fim para o qual foram contratados; (IV) Os serviços não tenham sido entregues no prazo fixado na OS; (V) A documentação comprobatória exigida no item\n\n3.2 não tenha sido apresentada integralmente.\n\n5.3 Em caso de recusa do aceite, a CONTRATADA terá prazo de até 10 (dez) dias corridos para sanar as inconformidades apontadas, sem ônus adicional para a CONTRATANTE. O prazo para retrabalho não interrompe a contagem de eventual multa por atraso.\n\n5.4 O descumprimento do prazo de entrega fixado na OS sujeitará a CONTRATADA ao pagamento de multa de 0,5% (zero vírgula cinco por cento) ao dia, calculada sobre o valor total da OS em atraso, limitada a 10% (dez por cento) do referido valor, sem prejuízo das demais sanções previstas neste instrumento.\n\n5.5 Após o aceite formal dos serviços, emitido por escrito pela CONTRATANTE, inicia- se o prazo de garantia previsto na Cláusula 8.\n\nCLÁUSULA 6 – OBRIGAÇÕES DA CONTRATADA\n\n6.1 Executar os serviços descritos na Cláusula 1 conforme as especificações técnicas, normas da ANATEL e demais normas legais e regulatórias aplicáveis ao setor de telecomunicações.\n\n6.2 Obedecer a todas as normas de segurança do trabalho, fornecendo e exigindo o uso de EPIs e EPCs adequados a cada atividade, especialmente em trabalhos em altura, espaços confinados e instalações elétricas.\n\n6.3 Responsabilizar-se por todos os danos causados a equipamentos, infraestrutura, sites de terceiros ou a qualquer pessoa em decorrência da execução dos serviços, respondendo civil e criminalmente por tais danos.\n\n6.4 Manter os sites organizados durante a execução dos trabalhos, removendo resíduos e materiais desmontados regularmente, garantindo a organização do local ao término de cada jornada.\n\n6.5 Dar destinação ambientalmente adequada aos equipamentos, cabos e materiais desmobilizados, conforme legislação ambiental vigente (Lei nº 12.305/2010 – Política Nacional de Resíduos Sólidos), apresentando certificados de destinação quando aplicável.\n\n6.6 Comunicar à CONTRATANTE, de imediato, qualquer ocorrência anormal verificada nos sites durante a execução dos serviços, incluindo danos preexistentes, falhas estruturais ou situações de risco.\n\n6.7 Não subcontratar, total ou parcialmente, os serviços objeto deste contrato sem prévia e expressa autorização por escrito da CONTRATANTE, respondendo pelos atos e omissões de eventuais subcontratadas como se seus fossem.\n\n6.8 Manter sigilosas, mesmo após findo este contrato, todas as informações privilegiadas, dados técnicos, localização de sites, contratos com clientes e demais informações da CONTRATANTE às quais tenha acesso em virtude deste contrato.\n\n6.9 Garantir que todos os profissionais envolvidos na execução dos serviços possuam as certificações, habilitações e treinamentos obrigatórios exigidos pelas NRs aplicáveis, mantendo a documentação atualizada e disponível para fiscalização a qualquer tempo.\n\n6.10 Não utilizar os sites de telecomunicações, equipamentos ou informações de clientes da CONTRATANTE para qualquer finalidade diversa da execução dos serviços contratados.\n\n\n\nCLÁUSULA 7 – OBRIGAÇÕES DA CONTRATANTE\n\n7.1 Fornecer à CONTRATADA todas as informações técnicas, documentos e Ordens de Serviço necessárias para a execução dos serviços, com antecedência razoável.\n\n7.2 Facilitar o acesso da CONTRATADA aos sites de telecomunicações indicados, providenciando as autorizações necessárias junto a proprietários, operadoras e órgãos competentes.\n\n7.3 Realizar os pagamentos conforme as condições estabelecidas na Cláusula 3, desde que cumpridas todas as obrigações do O\n\n9.1 Qualquer das partes poderá resilir o presente contrato a qualquer tempo, de forma imotivada, mediante notificação prévia por escrito com antecedência mínima de 30 (trinta) dias. Durante o aviso prévio, os serviços e os pagamentos devidos deverão ser cumpridos regularmente.\n\n9.2 Este contrato poderá ser rescindido por justa causa, independentemente de notificação, nas seguintes hipóteses: (I) Descumprimento de qualquer obrigação estabelecida neste contrato não sanado em 10 (dez) dias corridos após notificação escrita; (II) Dissolução, recuperação judicial, falência ou insolvência de qualquer das partes; (III) Caso fortuito ou força maior que suspenda a execução por mais de 15 (quinze) dias corridos;\n\n(IV) Ausência de documentação e licenças obrigatórias para execução dos serviços; (V) Prática de atos que atentem contra a ética, a probidade ou a reputação da CONTRATANTE ou de seus clientes; (VI) Subcontratação não autorizada, nos termos do item 6.7; (VII) Violação de obrigações de confidencialidade previstas na Cláusula 12.\n\n9.3 Em caso de rescisão por iniciativa da CONTRATADA sem justa causa, será devida à CONTRATANTE multa equivalente a 10% (dez por cento) do valor total estimado das OS em aberto no momento da rescisão.\n\n9.4 Em caso de rescisão por iniciativa da CONTRATANTE sem justa causa, serão devidos somente os valores correspondentes aos serviços efetivamente executados e aceitos, pendentes de pagamento, sem qualquer outra indenização.\n\n9.5 A rescisão por justa causa não afastará o direito da parte inocente de pleitear indenização por perdas e danos comprovadamente incorridos.\n\n\n\nCLÁUSULA 10 – AUTONOMIA DAS PARTES\n\n10.1 O presente contrato não estabelece qualquer vínculo de natureza societária, de associação ou empregatício entre as partes, que permanecem pessoas jurídicas independentes e autônomas.\n\n10.2 Os serviços objeto deste contrato serão prestados pela CONTRATADA sem exclusividade, não constituindo pressuposto para configuração
